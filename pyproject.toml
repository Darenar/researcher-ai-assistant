[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-ai-assistant"
version = "0.1.0"
description = "A small AI agent that creates maintainable research project structures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.2.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

